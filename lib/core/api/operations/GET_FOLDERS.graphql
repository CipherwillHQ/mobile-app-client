# Mirrors an existing Cipherwill web operation.
# Owns the mobile selection contract.
# Does not alter backend authorization.
query GET_FOLDERS($folder_id: String, $cursor: String) {
    getFolders(folder_id: $folder_id, cursor: $cursor) {
      folders {
        id
        name
        folder_id
        created_at
        updated_at
      }
      has_more
    }
  }

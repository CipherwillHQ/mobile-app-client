# Mirrors an existing Cipherwill web operation.
# Owns the mobile selection contract.
# Does not alter backend authorization.
query GET_PERSON_BY_IDS($list: [ID!]!) {
    getPersonByIds(list: $list) {
      __typename
      ... on User {
        id
        email
        first_name
        last_name
      }
      ... on Guest {
        id
        email
        first_name
      }
    }
  }

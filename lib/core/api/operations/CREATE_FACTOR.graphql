# Mirrors an existing Cipherwill web operation.
# Owns the mobile selection contract.
# Does not alter backend authorization.
mutation CREATE_FACTOR(
    $name: String!
    $type: String!
    $publicKey: String!
    $nonce: String!
  ) {
    createFactor(
      name: $name
      type: $type
      publicKey: $publicKey
      nonce: $nonce
    ) {
      id
      name
      type
      publicKey
      nonce
      created_at
      updated_at
    }
  }

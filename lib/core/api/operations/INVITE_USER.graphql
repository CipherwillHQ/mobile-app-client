# Mirrors an existing Cipherwill web operation.
# Owns the mobile selection contract.
# Does not alter backend authorization.
mutation INVITE_USER(
    $first_name: String!
    $email: String!
    $send_email: Boolean
    $anonymous_invite: Boolean
  ) {
    inviteUser(
      first_name: $first_name
      email: $email
      send_email: $send_email
      anonymous_invite: $anonymous_invite
    ) {
      ... on User {
        id
        email
        first_name
        invitation_email { status reason }
      }
      ... on Guest {
        id
        email
        first_name
        invitation_email { status reason }
      }
    }
  }

# Mirrors an existing Cipherwill web operation.
# Owns the mobile selection contract.
# Does not alter backend authorization.
query GET_METAMODELS(
    $type: MetamodelType
    $cursor: String
    $folder_id: String
  ) {
    getMetamodels(type: $type, cursor: $cursor, folder_id: $folder_id) {
      models {
        id
        type
        metadata
        folder_id
        ignored_beneficiaries
        created_at
        updated_at
      }
      has_more
    }
  }

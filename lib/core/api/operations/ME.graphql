# Mirrors an existing Cipherwill web operation.
# Owns the mobile selection contract.
# Does not alter backend authorization.
query ME {
    me {
      id
      email
      email_verified
      first_name
      middle_name
      last_name
      birth_date
      gender
      country
      address_line1
      address_line2
      city
      state
      postal_code
      plan
      last_accessed
      created_at
      updated_at
    }
  }

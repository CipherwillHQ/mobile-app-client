# Verifies source contracts against the actual web and backend repositories.
# Owns schema drift and bidirectional crypto library validation.
# Does not read deployment secrets or change either source repository.
name: Source contract compatibility
on: [workflow_dispatch, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.yarn-cache
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile-app-client
      - uses: actions/checkout@v4
        with:
          repository: CipherwillHQ/cipherwill-backend
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
          path: cipherwill-backend
      - uses: actions/checkout@v4
        with:
          repository: CipherwillHQ/Cipherwill
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
          path: Cipherwill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cipherwill-backend/package-lock.json
      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.YARN_CACHE_FOLDER }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-${{ hashFiles('Cipherwill/yarn.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: npm ci --ignore-scripts
        working-directory: cipherwill-backend
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
        working-directory: Cipherwill
      - run: node tool/export_backend_schema.mjs --check
        working-directory: mobile-app-client
      - run: node tool/export_asset_contracts.mjs --check
        working-directory: mobile-app-client
      - run: flutter pub get
        working-directory: mobile-app-client
      - run: flutter test lib/core/crypto/crypto_test.dart
        working-directory: mobile-app-client
      - run: node tool/crypto_interop.mjs --verify-mobile
        working-directory: mobile-app-client

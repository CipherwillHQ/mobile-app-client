# Checks native code and builds Android/iOS validation artifacts.
# Owns validation, caches and dispatch of signed Android release builds.
# Does not publish to app stores or expose signing credentials.
name: Mobile validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.41.4'
  ANDROID_NDK_VERSION: '28.2.13676358'
  XCODE_VERSION: '26.1.1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tool/release_*_test.mjs tool/android_signing_test.mjs
      - run: flutter pub get
      - run: node tool/check_source_rules.mjs --format
      - run: flutter analyze
      - run: flutter test lib test
      - run: bash tool/install_android_ndk_test.sh
  android:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release') }}
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Locate Android NDK
        id: ndk
        run: echo "path=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}
      - name: Install Android NDK
        run: bash tool/install_android_ndk.sh "$ANDROID_HOME" "$ANDROID_NDK_VERSION"
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
  android-release:
    needs: validate
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release') }}
    uses: ./.github/workflows/android-release.yml
    secrets:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CIPHERWILL_PRODUCTION_CONFIG: ${{ secrets.CIPHERWILL_PRODUCTION_CONFIG }}
  ios:
    runs-on: macos-15
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-${{ runner.arch }}-pod-downloads-${{ hashFiles('pubspec.lock', 'ios/Podfile', 'ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pod-downloads-
      - name: Cache installed CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: ${{ runner.os }}-${{ runner.arch }}-pods-${{ env.FLUTTER_VERSION }}-${{ env.XCODE_VERSION }}-${{ hashFiles('pubspec.lock', 'ios/Podfile', 'ios/Podfile.lock') }}
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign

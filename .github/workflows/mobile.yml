# Checks native app code and unsigned platform builds.
# Owns Android and macOS validation jobs.
# Does not publish builds or use production credentials.
name: Mobile validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: flutter pub get
      - run: dart run build_runner build
      - run: node tool/generate_operation_registry.mjs --check
      - run: node tool/check_source_rules.mjs --format
      - run: flutter analyze
      - run: flutter test lib test
  android:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-15
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign

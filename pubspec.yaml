# Configures the native Cipherwill client and its runtime dependencies.
# Owns package versions and bundled contract assets.
# Does not contain service credentials or signing secrets.
name: cipherwill
description: Cipherwill encrypted legacy planning for Android and iOS.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  graphql: ^5.2.4
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  flutter_quill: ^11.5.0
  pointycastle: ^4.0.0
  archive: ^4.5.2
  file_picker: ^10.2.4
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  sentry_flutter: 9.30.1
  reown_core: ^1.5.1
  reown_sign: ^1.4.1
  flutter_quill_delta_from_html: ^1.5.3
  dart_quill_delta: ^10.8.3
  html: ^0.15.6
  collection: ^1.19.1
  crypto: ^3.0.6
  gql: ^1.0.1
  uuid: ^4.5.2
  video_player: ^2.11.1
  pdfrx: ^2.4.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  graphql_codegen: ^3.0.2
  build_runner: ^2.15.1
flutter:
  uses-material-design: true
  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
          weight: 400
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilroy-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
  assets:
    - assets/contracts/

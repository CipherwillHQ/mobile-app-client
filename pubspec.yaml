# Configures native authentication and the Cipherwill WebView wrapper.
# Owns package versions and authentication branding assets.
# Does not include native application feature dependencies.
name: cipherwill
description: Native authentication and web client wrapper for Cipherwill.
publish_to: none
version: 1.0.2+5
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  flutter_tabler_icons: 1.43.0
  file_picker: ^13.2.0
  share_plus: 13.2.0
  path_provider: ^2.1.6
  webview_flutter_android: ^4.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  webview_flutter_platform_interface: ^2.15.1
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
          weight: 400
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilroy-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
  assets:
    - assets/images/
